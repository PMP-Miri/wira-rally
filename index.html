    const watchdog = setTimeout(() => showBootError(new Error('Permulaan melebihi 25 saat. Semak sambungan dan fail JavaScript dalam Console.')), 25000);
    const onError = event => {
      if (event.error || event.message) showBootError(event.error || event.message);
    };
    const onRejection = event => showBootError(event.reason);
    window.addEventListener('error', onError);
    window.addEventListener('unhandledrejection', onRejection);
    function loadScript(path) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          script.remove();
          reject(new Error('Masa memuatkan ' + path + ' tamat. Semak sambungan Internet.'));
        }, 12000);
        script.src = new URL(path, location.href).href;
        script.onload = () => { clearTimeout(timer); resolve(); };
        script.onerror = () => {
          clearTimeout(timer);
          script.remove();
          reject(new Error('Gagal memuatkan ' + path + '. Pastikan fail ini sudah dimuat naik pada aras yang sama dengan index.html.'));
        };
        document.head.append(script);
      });
    }
    try {
      await loadScript('./config.js?v=integrated-20261019-1');
      if (!window.WIRA_CONFIG || typeof window.WIRA_CONFIG !== 'object') throw new Error('config.js tidak menetapkan window.WIRA_CONFIG. Kekalkan format config.js asal.');
      if (failed) throw new Error('Permulaan telah dihentikan. Tekan Cuba semula.');
      if (!window.WiraCore) throw new Error('Kod teras bersepadu gagal dimulakan.');
      if (failed) throw new Error('Permulaan telah dihentikan. Tekan Cuba semula.');
      const urls = {api: makeModule(integratedSources.api), effects: makeModule(integratedSources.effects), scene: makeModule(integratedSources.scene)};
      const appSource = integratedSources.app
        .replace("'wira-api'", JSON.stringify(urls.api))
        .replace("'wira-effects'", JSON.stringify(urls.effects))
        .replace("'wira-scene'", JSON.stringify(urls.scene));
      await import(makeModule(appSource));
      if (!failed) {
        started = true;
        clearTimeout(watchdog);
      }
    } catch (error) {
      console.error('Wira Rally: gagal bermula', error);
      showBootError(error);
    } finally {
      window.removeEventListener('error', onError);
      window.removeEventListener('unhandledrejection', onRejection);
    }
  </script>
