<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wira Rally | Ujian logik</title><link rel="stylesheet" href="styles.css"><script src="shared/core.js"></script><script src="tests/core-tests.js"></script><script src="tests/backend-tests.js"></script></head><body><main style="max-width:900px;margin:40px auto;padding:24px"><a class="button ghost" href="index.html">← Kembali</a><h1>Ujian Wira Rally</h1><p>Ujian ini tidak menyentuh backend sebenar. Semua servis Google adalah mock. Kejayaan di sini bukan bukti deployment, CDN atau 100 telefon serentak sudah diuji.</p><button class="button primary" id="run">Jalankan ujian</button><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#161e32;padding:24px;border-radius:18px;line-height:1.6" role="status">Sedia.</pre></main><script>
document.getElementById('run').onclick=async function(){this.disabled=true;const el=document.getElementById('result');el.textContent='Menjalankan…';try{const r=await fetch('backend/Code.gs',{cache:'no-store'});if(!r.ok)throw Error('Tidak dapat membaca backend/Code.gs. Buka tests.html melalui hosting HTTP/HTTPS.');const source=await r.text();const results={core:runCoreTests(),backend:runBackendTests(source)};el.textContent=JSON.stringify(results,null,2);el.style.color='#bdf36b';}catch(e){el.textContent='GAGAL: '+e.message;el.style.color='#ffa7b1';}finally{this.disabled=false;}};
</script></body></html>
